<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}My Portfolio{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="p-4">

    <div class="mb-4">
        <a href="{% url 'home' %}" class="btn btn-outline-primary">🏠 Home</a>
    </div>

    {% block content %}
    <!-- Each page will fill in this area -->
    {% endblock %}

</body>
</html>
<!-- This is the base template for the portfolio application. It includes a link to Bootstrap for styling and a navigation button back to the home page. -->
<!-- The content block is defined for each specific page to fill in its own content. -->
<!-- This template is used as a base for all portfolio-related pages, providing a consistent layout and navigation. -->
